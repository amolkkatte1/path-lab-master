spring.application.name=pathlabmaster

server.port=8088

# ==============================
# Neon PostgreSQL
# ==============================

spring.datasource.url=jdbc:postgresql://ep-odd-sky-a4p0w4i9-pooler.us-east-1.aws.neon.tech/pathlabmaster?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_lbDwv6oyU4si
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# HikariCP - Low usage
# ==============================

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# ==============================
# JPA / Hibernate
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Don't keep EntityManager open after request
spring.jpa.open-in-view=false